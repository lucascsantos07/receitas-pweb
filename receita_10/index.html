<!DOCTYPE html>
<html>
   <head>
        <title>React Um</title>
        <link rel="stylesheet" href="style.css">
   </head>
   <body>
      <div id="app">
      </div>
      <script src="../libs/react.js"></script>
      <script src="../libs/react-dom.js"></script>
      <script src="../libs/babel.js"></script>

      <script type="text/babel">

        const bebidas = [
            {nome: "Havana", marca: "Engenho Anísio Santiago"},
            {nome: "Coca-Cola", marca: "Coca-Cola Company"},
            {nome: "Pepsi", marca: "PepsiCo"},
            {nome: "Fanta", marca: "Coca-Cola Company"},
            {nome: "Sprite", marca: "Coca-Cola Company"}
        ]

        const TabelaBebidas = (prop) => {
            return (
                <table id="tabela" border="1">
                    <thead>
                        <tr><th>Nome</th><th>Marca</th></tr>
                    </thead>
                    <tbody>
                        {prop.bebidas.map((bebida, index) => (
                            <tr key={index}>
                                <td>{bebida.nome}</td>
                                <td>{bebida.marca}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            )
        }

        const Cabecalho = () => {
            return <h1>Minha tabela de bebidas</h1>
        }

        const Botao = () => {
            return <button>Mostrar Bebidas</button>
        }

        const App = () => {
            const mostrarBebidas = () => {
                ReactDOM.render(
                    <div>
                        <Cabecalho />
                        <TabelaBebidas bebidas={bebidas} />
                        <Botao />
                    </div>,
                    document.getElementById("app")
                )
            }

            return (
                <div>
                    <Cabecalho />
                    <button onClick={mostrarBebidas}>
                        Mostrar Bebidas
                    </button>
                </div>
            )
        }

        ReactDOM.render(
            <App />,
            document.getElementById("app")
        )

        
      </script>
</body>
</html>
