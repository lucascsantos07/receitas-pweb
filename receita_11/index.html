<!DOCTYPE html>
<html>
   <head>
      <title>ReceitaReact - Classes</title>
   </head>
   <body>
      <div id="app">

      </div>

      <script src="../libs/react.js"></script>
      <script src="../libs/react-dom.js"></script>
      <script src="../libs/babel.js"></script>

      <script type="text/babel">

        class TabelaBebidas extends React.Component{

            constructor(props){
                super(props);
                this.titulo = props.titulo;
            }

            render(){
                return (
                    <div>
                        <h1>{this.titulo}</h1>
                        <table id="tabela" border="1">
                            <thead>
                                <tr><th>Nome</th><th>Marca</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>Havana</td><td>Engenho Anísio Santiago</td></tr>
                            </tbody>
                        </table>
                    </div>
                )
            }

        }

        class ListaComidas extends React.Component{

            constructor(props){
                super(props);
                this.titulo = props.titulo;
            }

            render(){
                return (
                    <div>
                        <h1>{this.titulo}</h1>
                        <ul>
                            <li>Feijão</li>
                            <li>Arroz</li>
                            <li>Macarrão</li>
                        </ul>
                    </div>
                )
            }
        }


         const TabelaBebidas__ = () => {
            return (
               <div>
                  <h1>Tabela de Bebidas</h1>
                  <table id="tabela" border="1">
                     <thead>
                        <tr><th>Nome</th><th>Marca</th></tr>
                     </thead>
                     <tbody>
                        <tr><td>Havana</td><td>Engenho Anísio Santiago</td></tr>
                     </tbody>
                  </table>
               </div>
            )
         }

         ReactDOM.render(
            <div>
                <TabelaBebidas titulo="Tabela de Cana"/>
                <ListaComidas titulo="Lista de Comidas"/>
            </div>
            ,
            document.getElementById("app"))

      </script>
   </body>
</html>
