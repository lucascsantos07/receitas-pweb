<!DOCTYPE html>

<html>   

   <head>

      <meta charset="UTF-8">   
      <link rel="stylesheet" href="estilo.css">   

   </head>



   <body>

      <div><button id="botaoCarregar">Carregando cervejas...</button></div>

      <div id="cervejasDiv"></div>            

   </body>   

   

   <script>



     let cervejas = [

         {

            name: "Guiness", 

            alcohol: "10%",

            style: "Imperial Stout",

            ibu: "45"            

         }, 

         {

            name: "Desperados",

            alcohol: "6%",

            style: "Lager",

            ibu: "18"             

         }, 

         {

            name: "Becks",

            alcohol: "5%",

            style: "Pilsen",

            ibu: "22"             

         }

      ]

    

      //cs é um array de objetos

      const carregarDiv = (cs, idElemento = "cervejasDiv", cabecalhos = ["Nome", "Álcool", "Estilo", "Amargor"], propriedades = ["name", "alcohol", "style", "ibu"]) => {

         const div = document.getElementById(idElemento)

         const cabecalhosHtml = cabecalhos.map( c => `<th>${c}</th>` )

         const itensHtml = cs.map( item => {

            const celulas = propriedades.map( prop => `<td>${item[prop]}</td>` )

            return `<tr>${celulas.join("\n")}</tr>`

         } ) 

         div.innerHTML = `<table><tr>${cabecalhosHtml.join("\n")}</tr>${itensHtml.join("\n")}</table>`

      }



      let botao = document.getElementById("botaoCarregar")

      botao.addEventListener("click", () => carregarDiv(cervejas) )                 



   </script>

</html>
