<!DOCTYPE html>

<html>   

   <head>

      <meta charset="UTF-8">      
      <link rel="stylesheet" href="estilo.css">

   </head>



   <body>

      <h1>API JSONPlaceholder</h1>

      <section>
         <h2 class="titulo-secao">Usuários</h2>
         <div><button id="botaoCarregarUsuarios">Carregando usuários...</button></div>
         <div id="usuariosDiv"></div>
      </section>

      <section>
         <h2 class="titulo-secao">Posts</h2>
         <div><button id="botaoCarregarPosts">Carregando posts...</button></div>
         <div id="postsDiv"></div>
      </section>

      <section>
         <h2 class="titulo-secao">Tarefas</h2>
         <div><button id="botaoCarregarTarefas">Carregando tarefas...</button></div>
         <div id="tarefasDiv"></div>
      </section>

   </body>   

   <script src="tabela.js"></script>

   <script>



      let usuarios = []
      let posts = []
      let tarefas = []

      

      //cs é um array de objetos, idElemento indica onde carregar, montarCard é uma função que recebe um item e devolve o html do card

      const carregarDiv = (cs, idElemento, montarCard) => {

         const div = document.getElementById(idElemento)

         const itensHtml = cs.map(montarCard)

         div.innerHTML = `${itensHtml.join("\n")}`

      }

      

      const montarCardUsuario = item => `

         <div class="usuario-card">
            <h2>${item.name}</h2>
            <p class="username">@${item.username}</p>
            <p><strong>Email:</strong> ${item.email}</p>
            <p><strong>Telefone:</strong> ${item.phone}</p>
            <p><strong>Site:</strong> <a href="http://${item.website}" target="_blank">${item.website}</a></p>
            <p><strong>Cidade:</strong> ${item.address.city}</p>
            <p><strong>Empresa:</strong> ${item.company.name}</p>
         </div>

      `



      const montarCardPost = item => `

         <div class="post-card">
            <span class="post-id">#${item.id}</span>
            <h3>${item.title}</h3>
            <p>${item.body}</p>
            <p class="post-user">Autor: usuário ${item.userId}</p>
         </div>

      `

      

      const carregarUsuarios = () => {

         document.getElementById("usuariosDiv").innerHTML = "Fazendo requisição..."

         fetch("https://jsonplaceholder.typicode.com/users").then(

            res => res.json()

         ).then(

            json => {
               usuarios = json
               carregarDiv(usuarios, "usuariosDiv", montarCardUsuario)
            }

         ).catch(

            err => document.getElementById("usuariosDiv").innerHTML = `Fudeu... ${err}`

         )

      }



      const carregarPosts = () => {

         document.getElementById("postsDiv").innerHTML = "Fazendo requisição..."

         fetch("https://jsonplaceholder.typicode.com/posts").then(

            res => res.json()

         ).then(

            json => {
               posts = json
               carregarDiv(posts, "postsDiv", montarCardPost)
            }

         ).catch(

            err => document.getElementById("postsDiv").innerHTML = `Fudeu... ${err}`

         )

      }



      const carregarTarefas = () => {

         document.getElementById("tarefasDiv").innerHTML = "Fazendo requisição..."

         fetch("https://jsonplaceholder.typicode.com/todos").then(

            res => res.json()

         ).then(

            json => {
               tarefas = json
               montarTabela(tarefas, "tarefasDiv", ["Id", "Tarefa", "Usuário", "Concluída"], ["id", "title", "userId", "completed"])
            }

         ).catch(

            err => document.getElementById("tarefasDiv").innerHTML = `Fudeu... ${err}`

         )

      }

      



      let botaoUsuarios = document.getElementById("botaoCarregarUsuarios")
      botaoUsuarios.addEventListener("click", () => carregarUsuarios() )                 

      let botaoPosts = document.getElementById("botaoCarregarPosts")
      botaoPosts.addEventListener("click", () => carregarPosts() )                 

      let botaoTarefas = document.getElementById("botaoCarregarTarefas")
      botaoTarefas.addEventListener("click", () => carregarTarefas() )                 

      

   </script>

</html>
